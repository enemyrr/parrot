name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS binary
    # macos-15 ships an Xcode 16 SDK, which has no FoundationModels framework —
    # the on-device cleanup path won't compile there.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: stage
        run: |
          # Ask the toolchain where it put the binary rather than hardcoding a
          # path — the layout moved from .build/<triple>/release to
          # .build/out/Products/Release in newer Swift versions.
          BIN="$(swift build -c release --arch arm64 --show-bin-path)/parrot"
          test -x "$BIN" || { echo "no binary at $BIN"; exit 1; }
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot

      - name: strip
        run: strip -x dist/parrot

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
